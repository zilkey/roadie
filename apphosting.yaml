# App Hosting config for roadie-prod-iab (backend "roadie-web-prod", us-central1, nodejs24). The NEXT_PUBLIC_* values are the web app's
# public Firebase config: safe in a public repo (rules and sign-in protect the data). Real secrets never go here;
# add them with `npx firebase apphosting:secrets:set <name> --project roadie-prod-iab` and reference them below.
# Never set NEXT_PUBLIC_USE_EMULATORS or any *_EMULATOR_HOST here.
runConfig:
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDKVRxdLhEnr4re3BvKYmOt5jR8mCVHb4Y
    availability: [ BUILD, RUNTIME ]
  # Our own domain, so Google sign-in says "continue to app.myroadie.online". next.config.ts proxies /__/auth and
  # /__/firebase to roadie-prod-iab.firebaseapp.com; the OAuth web client lists https://app.myroadie.online/__/auth/handler.
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: app.myroadie.online
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: roadie-prod-iab
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:43651994081:web:9567198e38f6af356c82a0"
    availability: [ BUILD, RUNTIME ]
  - variable: GCLOUD_PROJECT
    value: roadie-prod-iab
  # Roadie on Vertex AI with the backend's service account (needs the Vertex AI User role); no API key.
  - variable: ROADIE_MODEL
    value: vertex
  # Signs MCP session ids (mcp/web.ts) so every instance agrees (created per docs/MCP.md).
  - variable: MCP_SESSION_SECRET
    secret: MCP_SESSION_SECRET
  # Gas estimates: Google Maps Platform (addresses, geocoding, driving distance) and EIA (weekly pump prices). Set each with
  # `npx firebase apphosting:secrets:set GOOGLE_MAPS_API_KEY --project roadie-prod-iab` (and EIA_API_KEY).
  # A referenced-but-missing secret fails the rollout, so set the secret before deploying.
  # Without them the gas form still works: estimates show "—" and people type the amount themselves.
  # Maps: Places (New), Geocoding and Routes on roadie-prod-iab, pay as you go; the key is restricted to those three APIs.
  - variable: GOOGLE_MAPS_API_KEY
    secret: GOOGLE_MAPS_API_KEY
  - variable: EIA_BASE_URL
    value: https://api.eia.gov
  - variable: EIA_API_KEY
    secret: EIA_API_KEY
  # Gmail, Drive and Calendar (docs/FIREBASE-SETUP.md step 5). Setting GOOGLE_OAUTH_CLIENT_ID switches them from the fakes
  # to the real Google APIs; admins then connect on Settings > Google.
  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: 43651994081-elouttm8tt1i89ut44hg4lec410v6urj.apps.googleusercontent.com
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
  - variable: GOOGLE_TOKEN_KEY # 32 random bytes, base64: encrypts the stored refresh tokens
    secret: GOOGLE_TOKEN_KEY
  # Instagram & Facebook for Posts (docs/SETUP.md, "Meta (Instagram & Facebook)"). Set both secrets before deploying:
  # a referenced-but-missing secret fails the rollout. META_APP_ID is the Meta app's App ID (App settings > Basic).
  - variable: META_APP_ID
    value: "1437170305047353"
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
  - variable: META_TOKEN_KEY # 32 random bytes, base64: encrypts the stored Page token
    secret: META_TOKEN_KEY
  # The canonical address: base of every generated link ("can you play?" emails, MCP URL, share tags). Visits to the
  # old *.hosted.app address redirect here (next.config.ts).
  - variable: APP_URL
    value: https://app.myroadie.online
  # The public site (landing, /privacy, /terms). Its other paths redirect to APP_URL (next.config.ts).
  - variable: SITE_URL
    value: https://myroadie.online
