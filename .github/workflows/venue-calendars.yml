# Nightly venue-calendar refresh (docs/designs/venue-refresh.md). Every 15 minutes from 1:00 to 6:45 Denver (08:00-13:45 UTC,
# 7:00-12:45 in summer time), each call refreshes the few stalest calendars on prod. No secrets: the route checks this
# workflow's GitHub OIDC token (repo, main, this file). Run it by hand from the Actions tab (workflow_dispatch) any time.
name: Venue calendars

on:
  schedule:
    - cron: "*/15 8-13 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write # GitHub's OIDC token for the route
  contents: read

concurrency:
  group: venue-calendars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh the stalest calendars
        env:
          URL: https://app.myroadie.online/api/cron/venue-calendars
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$URL" | jq -r .value)
          curl -sS --fail-with-body --max-time 240 -X POST -H "Authorization: Bearer $token" "$URL"
          echo
